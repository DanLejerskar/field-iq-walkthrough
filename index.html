<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field IQ — Walkthrough</title>
  <style>* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #05080f;
  color: #f5f1e8;
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
}

#app {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#stage-wrap {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 12px 12px 0;
  min-height: 0;
}

#stage {
  width: min(100%, calc((100vh - 162px) * 1.7778));
  aspect-ratio: 16 / 9;
  position: relative;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
  border-radius: 6px;
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}

.slide.active {
  opacity: 1;
  pointer-events: auto;
}

.slide-canvas {
  position: absolute;
  inset: 0;
  container-type: size;
}

.el {
  position: absolute;
  overflow: hidden;
  line-height: 1.15;
  white-space: pre-wrap;
  word-break: break-word;
  transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease, opacity 0.14s ease;
}

.el img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.el-text {
  display: flex;
  align-items: center;
  padding: 0 2px;
}

.el-text.center { justify-content: center; text-align: center; }
.el-text.right { justify-content: flex-end; text-align: right; }

.el-text.center .text-run {
  width: 100%;
  text-align: center;
  line-height: 1;
}

.el-text.stacked {
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  line-height: 1.02;
  gap: 0.15cqw;
}

.el-text.stacked .text-run {
  display: block;
  white-space: nowrap;
}

.el-text.centered,
button.el.centered {
  justify-content: center;
  text-align: center;
  align-items: center;
}

.el.phone-panel {
  border-radius: 0.75cqw;
  overflow: hidden;
}

.el.phone-outer {
  border-radius: 3.2cqw;
  overflow: hidden;
  box-sizing: border-box;
}

.el.phone-inner {
  border-radius: 2.8cqw;
}

.el.app-icon,
button.el.app-icon {
  border-radius: 0.65cqw;
}

.el.status-dot {
  border-radius: 999px;
}

.el.sync-icon {
  border-radius: 999px;
}

.el.progress-pip {
  border-radius: 999px;
}

.el.success-card {
  border-radius: 0.55cqw;
  overflow: hidden;
}

.el.phone-ui-card {
  border-radius: 0.55cqw;
  overflow: hidden;
}

.el.glass-panel {
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.el.phone-nav-icon {
  border-radius: 999px;
  z-index: 146;
}

.el-text.phone-nav-label {
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 147;
  line-height: 1;
  padding: 0;
  overflow: hidden;
}

.el-text.phone-nav-label .text-run {
  width: 100%;
  text-align: center;
  white-space: nowrap;
  line-height: 1;
}

@keyframes rotate-hint {
  from { transform: rotate(0deg); }
  to { transform: rotate(-90deg); }
}

.el.el-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.el.btn-ghost {
  border-radius: 0.4cqw;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.el.btn-ghost .text-run {
  width: 100%;
  text-align: center;
}

.el.btn-setup,
.el.btn-training,
.el.btn-monitor,
.el.btn-field {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 0.45cqw;
}

.el-text.single-line {
  align-items: center;
  white-space: nowrap;
  overflow: visible;
}

.el-text.single-line .text-run {
  white-space: nowrap;
}

.el-text.footer-caption {
  align-items: center;
  justify-content: flex-start;
  line-height: 1;
  padding: 0 8px;
  box-sizing: border-box;
}

.el-text.footer-caption-right {
  justify-content: flex-end;
  text-align: right;
}

.el-text.footer-caption .text-run {
  line-height: 1;
}

.el.step-badge {
  border-radius: 0.45cqw;
}

/* Slide 2 (Home) — faithful PPTX layout + avatar + visible feature copy */
.slide-home .el {
  overflow: visible;
}

.slide-home .el-text {
  align-items: flex-start;
}

.slide-home .el-text.hub-journey-digit {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0;
}

.slide-home .el-text.hub-journey-digit .text-run {
  width: 100%;
  text-align: center;
  font-weight: 800 !important;
  line-height: 1;
}

.slide-home .el-avatar-round,
.slide-home .el-avatar-round img {
  border-radius: 999px;
  object-fit: cover;
}

.slide-home .el-avatar-square,
.slide-home .el-avatar-square img {
  border-radius: 0;
  object-fit: cover;
}

button.el {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  font: inherit;
  color: inherit;
  padding: 0;
  margin: 0;
  background: transparent;
}

/* Interactive controls inside the mockup */
.el.interactive {
  cursor: pointer;
  user-select: none;
}

.el.btn-primary {
  border-radius: 0.45cqw;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #ffffff;
}

.el.btn-primary .text-run {
  color: #ffffff !important;
}

.el.btn-primary:hover {
  filter: brightness(1.14);
  transform: translateY(-1px) scale(1.015);
  box-shadow: 0 0 0 1px rgba(255, 180, 120, 0.35), 0 8px 28px rgba(224, 123, 71, 0.35);
}

.el.btn-primary:active {
  transform: translateY(0) scale(0.985);
  filter: brightness(0.96);
}

.el.btn-setup:hover { box-shadow: 0 0 0 1px rgba(91, 168, 214, 0.4), 0 8px 24px rgba(91, 168, 214, 0.28); }
.el.btn-training:hover { box-shadow: 0 0 0 1px rgba(178, 132, 230, 0.4), 0 8px 24px rgba(178, 132, 230, 0.28); }
.el.btn-monitor:hover { box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.4), 0 8px 24px rgba(16, 185, 129, 0.28); }

.el.btn-ghost:hover {
  filter: brightness(1.2);
  background-color: rgba(255, 255, 255, 0.06) !important;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.el.btn-nav-tab {
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.82;
}

.el.btn-nav-tab:hover {
  opacity: 1;
  color: #fff !important;
  text-shadow: 0 0 12px rgba(224, 123, 71, 0.45);
  transform: translateY(-1px);
}

.el.btn-link:hover {
  opacity: 1;
  text-decoration: underline;
  text-underline-offset: 0.15em;
  color: #ffb88a !important;
}

.el.btn-journey {
  border-radius: 0.5cqw;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.el.btn-journey:hover {
  filter: brightness(1.12);
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}

.el.pressed {
  animation: pressPulse 0.35s ease;
}

@keyframes pressPulse {
  0% { transform: scale(1); }
  40% { transform: scale(0.97); }
  100% { transform: scale(1); }
}

#nav, #jump {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 6px 16px 10px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

#nav button, #jump button {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(21, 32, 51, 0.95);
  color: #f5f1e8;
  border-radius: 8px;
  padding: 0.55rem 0.95rem;
  font: inherit;
  cursor: pointer;
  transition: background 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
}

#nav button:hover, #jump button:hover {
  background: rgba(35, 48, 70, 0.98);
  transform: translateY(-1px);
}

#btn-next {
  background: #e07b47;
  border-color: #e07b47;
  color: #fff;
  font-weight: 700;
}

#btn-next:hover {
  background: #f08a55;
  box-shadow: 0 8px 24px rgba(224, 123, 71, 0.35);
}

#indicator {
  min-width: 72px;
  text-align: center;
  color: rgba(245, 241, 232, 0.72);
  font-size: 0.92rem;
}

#jump button {
  font-size: 0.82rem;
  opacity: 0.88;
}

/* Slide 1 — journey entry cards */
.journey-card {
  position: absolute;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 0.45cqw;
  padding: 0.35cqw 0.5cqw;
  background: #152033;
  border: 1px solid var(--accent);
  border-radius: 0.35cqw;
  cursor: pointer;
  text-align: left;
  color: #f5f1e8;
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease, border-color 0.16s ease;
}

.journey-card:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 10px 28px rgba(0, 0, 0, 0.38);
}

.journey-card:active {
  transform: translateY(0) scale(0.985);
  filter: brightness(1.02);
}

.journey-badge {
  flex: 0 0 auto;
  width: 2.05cqw;
  height: 2.05cqw;
  min-width: 1.35rem;
  min-height: 1.35rem;
  border-radius: 0.28cqw;
  background: var(--accent);
  color: #0b1424;
  font-weight: 800;
  font-size: 1.05cqw;
  display: grid;
  place-items: center;
  line-height: 1;
}

.journey-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.08em;
  min-width: 0;
  flex: 1;
}

.journey-copy strong {
  display: block;
  font-size: 0.78cqw;
  font-weight: 700;
  line-height: 1.15;
  white-space: normal;
}

.journey-copy small {
  display: block;
  font-size: 0.58cqw;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #a6afc2;
  font-weight: 600;
  line-height: 1.1;
}

/* Slide 3 — invisible full-card journey click targets */
.journey-hitbox {
  position: absolute;
  z-index: 40;
  padding: 0;
  margin: 0;
  border: 1px solid transparent;
  border-radius: 0.35cqw;
  background: transparent;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
}

.journey-hitbox:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 10px 28px rgba(0, 0, 0, 0.38);
}

.journey-hitbox:active {
  transform: translateY(0) scale(0.99);
}

/* Journey intro slides — centered round progress + left-aligned headline */
.journey-progress {
  position: absolute;
  z-index: 25;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.45cqw;
}

.journey-progress-label {
  width: 100%;
  text-align: center;
  font-size: 0.72cqw;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6b7689;
  line-height: 1.2;
}

.journey-progress-steps {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.journey-connector {
  width: 1.85cqw;
  min-width: 0.85rem;
  height: 1px;
  background: #3d4d66;
  flex-shrink: 0;
  position: relative;
  z-index: 0;
}

.journey-connector.done {
  background: var(--accent);
}

.journey-step {
  position: relative;
  z-index: 1;
  width: 2.15cqw;
  height: 2.15cqw;
  min-width: 1.2rem;
  min-height: 1.2rem;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 0.82cqw;
  font-weight: 700;
  line-height: 1;
  border: 1px solid #2c3853;
  color: #6b7689;
  background: #0b1424;
  box-sizing: border-box;
}

.journey-step.active {
  width: 2.45cqw;
  height: 2.45cqw;
  border-color: var(--accent);
  background: var(--accent);
  color: #0b1424;
  box-shadow: 0 0 0 0.16cqw #0b1424, 0 0 0 0.26cqw var(--accent);
}

.journey-step.done {
  border-color: var(--accent);
  background: var(--accent);
  color: #0b1424;
}

.slide-journey-intro .el-text.left {
  justify-content: flex-start;
  text-align: left;
}

/* Genesis training step slides — 9-step progress strip */
.training-step-progress.gs-stepper {
  position: absolute;
  z-index: 22;
  box-sizing: border-box;
}

.slide-training-step .el.genesis-g3-box {
  border-radius: 0.25cqw;
}

.slide-training-step .el-text.centered,
.slide-training-step .el-text.center {
  justify-content: center;
  align-items: center;
}

.slide-training-step .el.filter-chip {
  border-radius: 0.35cqw;
}

.slide-training-step .el.genesis-nav-btn {
  border-radius: 0.4cqw;
}

.slide-training-step .el.training-avatar {
  border-radius: 999px;
}

.slide-training-step .el-text.training-maya-kicker {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  line-height: 1;
  z-index: 130;
}

.slide-training-step .el-text.training-maya-kicker .text-run {
  line-height: 1;
}

.slide-training-step .el-text.center .text-run {
  width: 100%;
  text-align: center;
  line-height: 1;
}

.slide-training-step .el.parsing-box {
  border-radius: 0.35cqw;
}

.slide-training-step .el.transcript-box {
  border-radius: 0.35cqw;
}

.slide-training-step .el-text.slide18-box-title,
.slide-training-step .el-text.slide18-box-body {
  align-items: flex-start;
  justify-content: flex-start;
  line-height: 1.15;
  overflow: visible;
  padding: 0;
}

.slide-training-step .el-text.slide18-box-body .text-run {
  line-height: 1.22;
}

.slide-training-step .el-text.slide18-transcript-quote .text-run {
  line-height: 1.12;
}

.slide-training-step .el-text.slide19-step-label {
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.1;
  padding: 0;
  overflow: visible;
}

.slide-training-step .el-text.slide19-step-label .text-run {
  width: 100%;
  text-align: center;
  font-weight: 700 !important;
}

.slide-training-step .el-text.slide20-table-step {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0;
}

.slide-training-step .el-text.slide20-table-step .text-run {
  width: 100%;
  text-align: center;
  font-weight: 700 !important;
}

.assembly-layers-panel {
  position: absolute;
  z-index: 120;
  box-sizing: border-box;
  background: #152033;
  border: 1px solid #2c3853;
  border-radius: 0.45cqw;
  padding: 0.75cqw 0.85cqw 0.65cqw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.alp-header {
  font-size: 0.58cqw;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #b284e6;
  margin-bottom: 0.55cqw;
}

.alp-rows {
  display: flex;
  flex-direction: column;
  gap: 0.42cqw;
  flex: 1;
  min-height: 0;
}

.alp-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 0.45cqw;
}

.alp-num {
  font-size: 0.58cqw;
  font-weight: 700;
  color: #b284e6;
  min-width: 1.1cqw;
}

.alp-main {
  min-width: 0;
}

.alp-name {
  display: block;
  font-size: 0.56cqw;
  color: #f5f1e8;
  margin-bottom: 0.18cqw;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.alp-bar {
  height: 0.42cqw;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.alp-bar.done .alp-fill {
  width: 100%;
  height: 100%;
  display: block;
  background: #b284e6;
  border-radius: 999px;
}

.alp-bar.progress .alp-fill {
  height: 100%;
  display: block;
  background: #5ba8d6;
  border-radius: 999px;
}

.alp-status {
  font-size: 0.56cqw;
  font-weight: 700;
  min-width: 1.5cqw;
  text-align: right;
}

.alp-status.done {
  color: #f5f1e8;
}

.alp-status.pct {
  color: #5ba8d6;
}

.carlos-refinement-panel {
  position: absolute;
  z-index: 120;
  box-sizing: border-box;
  background: #152033;
  border: 1px solid #2c3853;
  border-radius: 0.45cqw;
  padding: 0.75cqw 0.85cqw 0.65cqw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.crp-header {
  font-size: 0.58cqw;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #5ba8d6;
  margin-bottom: 0.55cqw;
}

.crp-turns {
  display: flex;
  flex-direction: column;
  gap: 0.55cqw;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.crp-turn {
  display: flex;
  flex-direction: column;
  gap: 0.18cqw;
}

.crp-label {
  font-size: 0.5cqw;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #8b95a8;
}

.crp-turn.carlos .crp-label {
  color: #5ba8d6;
}

.crp-carlos-text {
  font-size: 0.54cqw;
  line-height: 1.35;
  color: #5ba8d6;
}

.crp-genesis-box {
  font-size: 0.52cqw;
  line-height: 1.35;
  color: #f5f1e8;
  background: rgba(178, 132, 230, 0.12);
  border: 1px solid #b284e6;
  border-radius: 0.35cqw;
  padding: 0.35cqw 0.45cqw;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 88px;
  transform: translateX(-50%);
  background: rgba(21, 32, 51, 0.96);
  border: 1px solid rgba(224, 123, 71, 0.45);
  color: #f5f1e8;
  padding: 0.65rem 1rem;
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  font-size: 0.88rem;
  z-index: 100;
  pointer-events: none;
}

.toast.hidden { display: none; }

/* Slide 2 — HOME / Dashboard hub */
.hub-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 16.2% 1fr;
  font-size: 1.05cqw;
}

.hub-sidebar {
  display: flex;
  flex-direction: column;
  height: 100%;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(10, 16, 28, 0.55);
  padding: 0.8cqw 0.55cqw;
  min-height: 0;
}

.hub-brand {
  display: flex;
  align-items: center;
  gap: 0.45cqw;
  padding: 0.35cqw 0.25cqw 0.8cqw;
}

.hub-brand-mark {
  width: 2.1cqw;
  height: 2.1cqw;
  min-width: 1.5rem;
  min-height: 1.5rem;
  border-radius: 0.35cqw;
  background: #e07b47;
  color: #fff;
  font-weight: 800;
  display: grid;
  place-items: center;
}

.hub-brand strong { display: block; font-size: 0.95cqw; }
.hub-brand small { color: #a6afc2; letter-spacing: 0.12em; font-size: 0.58cqw; }

.hub-nav {
  display: flex;
  flex-direction: column;
  gap: 0.12cqw;
  flex: 1;
}

.hub-nav-item {
  appearance: none;
  border: 0;
  background: transparent;
  color: #c8d0de;
  text-align: left;
  padding: 0.38cqw 0.45cqw;
  border-radius: 0.3cqw;
  font: inherit;
  font-size: 0.78cqw;
  cursor: pointer;
  transition: background 0.14s ease, color 0.14s ease;
}

.hub-nav-item.active,

  <script>const cfg = window.SLIDES_CONFIG;
const stage = document.getElementById("stage");
const indicator = document.getElementById("indicator");
const toastEl = document.getElementById("toast");
let current = 1;

function esc(s = "") {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function renderRuns(textObj) {
  if (!textObj.runs?.length) return esc(textObj.text || "");
  return textObj.runs
    .map((r) => {
      const styles = [];
      if (r.size) styles.push(`font-size:${(r.size / 960) * 100}cqw`);
      if (r.color) styles.push(`color:${r.color}`);
      if (r.bold) styles.push("font-weight:700");
      if (r.italic) styles.push("font-style:italic");
      const align = r.align ? ` text-align:${r.align};` : "";
      const text = String(r.text || "").replace(/\n+$/, "");
      return `<span class="text-run" style="${styles.join(";")}${align}">${esc(text)}</span>`;
    })
    .join("");
}

function isStackedText(el) {
  if (el.stacked) return true;
  const text = el.text?.text || "";
  return text.includes("\n") || (el.text?.runs?.length > 1 && el.text.runs.some((r) => String(r.text || "").includes("\n")));
}

function elClasses(el, align = "left", stacked = false) {
  const parts = ["el"];
  if (el.text) parts.push("el-text", align);
  if (stacked) parts.push("stacked");
  if (el.centered) parts.push("centered");
  if (el.singleLine) parts.push("single-line");
  if (el.footerCaption) parts.push("footer-caption");
  if (el.footerCaptionRight) parts.push("footer-caption-right");
  if (el.trainingMayaKicker) parts.push("training-maya-kicker");
  if (el.hubJourneyDigit) parts.push("hub-journey-digit");
  if (el.slide18BoxTitle) parts.push("slide18-box-title");
  if (el.slide18BoxBody) parts.push("slide18-box-body");
  if (el.slide18TranscriptQuote) parts.push("slide18-transcript-quote");
  if (el.slide19StepLabel) parts.push("slide19-step-label");
  if (el.slide20TableStep) parts.push("slide20-table-step");
  if (el.phoneNavLabel) parts.push("phone-nav-label");
  if (el.phoneNavIcon) parts.push("phone-nav-icon");
  if (el.glassPanel) parts.push("glass-panel");
  if (el.rounded) parts.push(el.rounded);
  return parts.join(" ");
}

function elStyle(el) {
  const style = [
    `left:${el.x}%`,
    `top:${el.y}%`,
    `width:${el.w}%`,
    `height:${el.h}%`,
    `z-index:${el.z ?? 0}`,
  ];
  if (el.fill) style.push(`background:${el.fill}`);
  if (el.border) style.push(`border:1px solid ${el.border}`);
  return style.join(";");
}

function renderElement(el) {
  const style = elStyle(el);

  if (el.kind === "image") {
    const avatar = el.avatar ? ` el-avatar el-avatar-${el.avatar === true ? "round" : el.avatar}` : "";
    const cls = `el el-image${avatar}`;
    return `<div class="${cls}" style="${style}"><img src="${esc(el.src)}" alt="" loading="lazy" /></div>`;
  }

  if (el.kind === "group") {
    const kids = (el.children || []).map(renderElement).join("");
    return `<div class="el" style="${style}">${kids}</div>`;
  }

  if (el.kind === "button") {
    const cls = `el interactive btn-${el.variant || "ghost"}${el.centered ? " centered" : ""}${el.rounded ? ` ${el.rounded}` : ""}`;
    const label = el.text ? renderRuns(el.text) : esc(el.label || "");
    const align = el.text?.runs?.find((r) => r.align)?.align || "center";
    const goto = el.goto ? ` data-goto="${el.goto}"` : "";
    return `<button type="button" class="${cls} ${align}" style="${style}" data-label="${esc(el.label || "")}"${goto}>${label}</button>`;
  }

  if (el.text) {
    const align = el.text.runs?.find((r) => r.align)?.align || "left";
    const stacked = isStackedText(el);
    return `<div class="${elClasses(el, align, stacked)}" style="${style}">${renderRuns(el.text)}</div>`;
  }

  const plainCls = elClasses({ ...el, text: null });
  return `<div class="${plainCls}" style="${style}"></div>`;
}

function renderJourneyHitboxes(cards = []) {
  return cards
    .map(
      (c) => `
    <button
      type="button"
      class="journey-hitbox interactive"
      style="left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%;--accent:${esc(c.accent)}"
      data-goto="${c.target}"
      data-label="${esc(c.title)}"
      aria-label="${esc(c.title)}"
    ></button>`
    )
    .join("");
}

function renderJourneyProgress(progress) {
  const parts = [];
  for (let i = 0; i < progress.total; i += 1) {
    const n = i + 1;
    const accent = progress.accents[i];
    const state = n < progress.active ? "done" : n === progress.active ? "active" : "pending";
    const label = state === "done" ? "✓" : String(n);
    parts.push(`<span class="journey-step ${state}" style="--accent:${esc(accent)}">${esc(label)}</span>`);
    if (i < progress.total - 1) {
      const connectorDone = n < progress.active;
      parts.push(
        `<span class="journey-connector ${connectorDone ? "done" : "pending"}" style="--accent:${esc(accent)}"></span>`
      );
    }
  }

  return `
    <div class="journey-progress" style="left:${progress.x}%;top:${progress.y}%;width:${progress.w}%;">
      <div class="journey-progress-label">${esc(progress.label)}</div>
      <div class="journey-progress-steps">${parts.join("")}</div>
    </div>`;
}

function renderJourneyCards(cards = []) {
  return cards
    .map(
      (c) => `
    <button
      type="button"
      class="journey-card interactive"
      style="left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%;--accent:${esc(c.accent)}"
      data-goto="${c.target}"
      data-label="${esc(c.title)}"
    >
      <span class="journey-badge">${c.num}</span>
      <span class="journey-copy">
        <strong>${esc(c.title)}</strong>
        <small>${esc(c.steps)}</small>
      </span>
    </button>`
    )
    .join("");
}

function renderTrainingStepProgress(progress) {
  const cols = progress.labels
    .map((label, i) => {
      const n = i + 1;
      const accent = n >= 8 ? progress.deployAccent || "#E07B47" : progress.accent;
      const state = n < progress.active ? "done" : n === progress.active ? "active" : "pending";
      const glyph = state === "done" ? "✓" : String(n);
      return `
        <div class="gs-step-col">
          <span class="gs-step ${state}" style="--accent:${esc(accent)}">${esc(glyph)}</span>
          <span class="gs-step-label ${state}">${esc(label)}</span>
        </div>`;
    })
    .join("");

  return `
    <div class="training-step-progress gs-stepper" style="left:${progress.x}%;top:${progress.y}%;width:${progress.w}%;height:${progress.h}%;">
      <div class="gs-stepper-columns">${cols}</div>
    </div>`;
}

function renderCarlosRefinementPanel(panel) {
  if (!panel?.turns?.length) return "";
  const turns = panel.turns
    .map((turn) => {
      if (turn.speaker === "genesis") {
        return `
          <div class="crp-turn genesis">
            <div class="crp-label">${esc(turn.label)}</div>
            <div class="crp-genesis-box">${esc(turn.text)}</div>
          </div>`;
      }
      return `
        <div class="crp-turn carlos">
          <div class="crp-label">${esc(turn.label)}</div>
          <div class="crp-carlos-text">${esc(turn.text)}</div>
        </div>`;
    })
    .join("");

  return `
    <div
      class="carlos-refinement-panel"
      style="left:${panel.x}%;top:${panel.y}%;width:${panel.w}%;height:${panel.h}%;"
    >
      <div class="crp-header">${esc(panel.title || "CARLOS · REFINING WITH AI")}</div>
      <div class="crp-turns">${turns}</div>
    </div>`;
}

function renderAssemblyLayersPanel(panel) {
  if (!panel?.layers?.length) return "";
  const rows = panel.layers
    .map((layer) => {
      if (layer.done) {
        return `
          <div class="alp-row">
            <span class="alp-num">${layer.num}.</span>
            <div class="alp-main">
              <span class="alp-name">${esc(layer.name)}</span>
              <div class="alp-bar done"><span class="alp-fill"></span></div>
            </div>
            <span class="alp-status done">✓</span>
          </div>`;
      }
      const pct = layer.pct ?? 0;
      return `
        <div class="alp-row">
          <span class="alp-num">${layer.num}.</span>
          <div class="alp-main">
            <span class="alp-name">${esc(layer.name)}</span>
            <div class="alp-bar progress"><span class="alp-fill" style="width:${pct}%"></span></div>
          </div>
          <span class="alp-status pct">${pct}%</span>
        </div>`;
    })
    .join("");

  return `
    <div
      class="assembly-layers-panel"
      style="left:${panel.x}%;top:${panel.y}%;width:${panel.w}%;height:${panel.h}%;"
    >
      <div class="alp-header">9 ASSEMBLY LAYERS</div>
      <div class="alp-rows">${rows}</div>
    </div>`;
}

function renderGenesisStepper(activeStep, steps) {
  const cols = steps
    .map((label, i) => {
      const n = i + 1;
      const accent = n >= 8 ? "#E07B47" : "#B284E6";
      const state = n < activeStep ? "done" : n === activeStep ? "active" : "pending";
      const glyph = state === "done" ? "✓" : String(n);
      return `
        <div class="gs-step-col">
          <span class="gs-step ${state}" style="--accent:${esc(accent)}">${esc(glyph)}</span>
          <span class="gs-step-label ${state}">${esc(label)}</span>
        </div>`;
    })
    .join("");
  return `<div class="gs-stepper-columns">${cols}</div>`;
}

function statusClass(status) {
  if (status === "NEEDS SCAN") return "needs-scan";
  if (status === "LIBRARY") return "library";
  return "scanned";
}

function renderSlide(slide) {
  if (slide.template === "genesis-step-1") {
    return renderGenesisStep1Slide(slide);
  }
  const base = slide.shapes.map(renderElement).join("");
  let cards = "";
  if (slide.journeyCards?.length) {
    cards = slide.template === "entry-cover" ? renderJourneyCards(slide.journeyCards) : renderJourneyHitboxes(slide.journeyCards);
  }

  const trainingProgress = slide.trainingStepProgress ? renderTrainingStepProgress(slide.trainingStepProgress) : "";
  const assemblyPanel = slide.assemblyLayersPanel ? renderAssemblyLayersPanel(slide.assemblyLayersPanel) : "";
  const carlosPanel = slide.carlosRefinementPanel ? renderCarlosRefinementPanel(slide.carlosRefinementPanel) : "";
  const slideClass = `${slide.id === 2 || slide.id === 49 ? " slide-home" : ""}${slide.journeyProgress ? " slide-journey-intro" : ""}${slide.trainingStepProgress ? " slide-training-step" : ""}${slide.uiMockup ? " slide-ui-mockup" : ""}${slide.id === 34 ? " slide-field-use-34" : ""}`;
  return `<div class="slide${slideClass}" data-id="${slide.id}"><div class="slide-canvas" style="background:${slide.background}">${base}${cards}${progress}${trainingProgress}${assemblyPanel}${carlosPanel}</div></div>`;
}

function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toastEl.classList.add("hidden"), 2200);
}

function bindSlideInteractions(root) {
  root.querySelectorAll(".interactive").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 350);
      const label = btn.dataset.label || btn.textContent.trim();
      if (btn.dataset.goto) {
        goTo(Number(btn.dataset.goto));
        showToast(`Opening ${label}`);
        return;
      }
      showToast(`"${label}" — will connect to app when built`);
    });
  });
}

function mount() {
  stage.innerHTML = cfg.slides.map(renderSlide).join("");
  stage.querySelectorAll(".slide").forEach((slideEl) => bindSlideInteractions(slideEl));
  show(1);
}

function show(id) {
  current = id;
  stage.querySelectorAll(".slide").forEach((el) => {
    el.classList.toggle("active", Number(el.dataset.id) === id);
  });
  indicator.textContent = `${id} / ${cfg.totalSlides}`;
}

function next() {
  if (current < cfg.totalSlides) show(current + 1);
}

function back() {
  if (current > 1) show(current - 1);
}

function goTo(id) {
  if (cfg.slides.some((s) => s.id === id)) show(id);
}

document.getElementById("btn-next").addEventListener("click", next);
document.getElementById("btn-back").addEventListener("click", back);
document.getElementById("btn-home").addEventListener("click", () => goTo(cfg.hubSlide || 2));
document.querySelectorAll("#jump [data-target]").forEach((btn) => {
  btn.addEventListener("click", () => goTo(Number(btn.dataset.target)));
});

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") back();
  if (e.key.toLowerCase() === "h") goTo(cfg.hubSlide || 2);
  if (e.key === "1") goTo(cfg.journeyEntry.setup);
  if (e.key === "2") goTo(cfg.journeyEntry.training);
  if (e.key === "3") goTo(cfg.journeyEntry.field);
  if (e.key === "4") goTo(cfg.journeyEntry.monitor);
});

mount();
</script>
</body>
</html>
