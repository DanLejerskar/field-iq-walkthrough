name: Publish product overview

on:
  push:
    branches:
      - cursor/eon-product-overview-589c
    paths:
      - eon-product-overview/**
      - .github/workflows/publish-overview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload overview
        uses: actions/upload-pages-artifact@v3
        with:
          path: eon-product-overview

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
